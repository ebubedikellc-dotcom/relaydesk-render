services:
  relaydesk:
    build: .
    container_name: relaydesk
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - relaydesk_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  relaydesk_data:

